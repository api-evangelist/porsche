description: >-
  The Porsche Design System (PDS) is Porsche's first-party, publicly consumable
  client-side component library: Stencil-built web components plus Angular, React and Vue
  wrappers, design tokens, styles and assets. It is the largest genuinely public
  developer surface Porsche operates — 648 GitHub stars, MIT-adjacent proprietary license,
  documented at designsystem.porsche.com and distributed through both npm and a
  version-pinned CDN. It is a UI component library, not an API SDK.
