    humanURL: https://developer.porsche.com/
    properties:
      - url: https://developer.porsche.com/
        type: Documentation
    description: >-
      The Porsche ID API Portal is where Porsche AG publishes and manages the APIs that
      integrate Porsche ID, its customer identity platform. It is not a public API
      programme: the portal's own FAQ states "We do not offer any public APIs" and limits
      access to Porsche AG and approved Porsche Partner Companies, on the grounds that the
      APIs expose sensitive customer data requiring contractual protection. Partner status
      is applied for through the VW Group Supply Portal, after which Porsche's integration
      team runs onboarding. The signed-in portal lives at portal.developer.porsche.com
      behind a Microsoft Entra ID login; APIs unrelated to Porsche ID are handled by a
      separate, equally restricted Porsche Developer Hub at developerhub.porsche.io. The
      one part of the estate that is anonymously machine-readable is the Porsche ID OpenID
      Connect discovery document at identity.porsche.com.
