description: >-
  Lifecycle posture for the Porsche developer surface. Porsche publishes a real, written
  version-support and end-of-life policy — but only for the Porsche Design System. The
  partner-gated API surfaces (Porsche ID APIs, Porsche Developer Hub) publish no
  anonymously readable versioning, deprecation, sunset or SLA policy, and no status page
  exists on any Porsche host we could reach.
versioning:
  scheme: semver
  applies_to: Porsche Design System
  current_major: '4'
  current_version: 4.6.0
  documentation_per_major: true
  documentation_note: >-
    Each major gets its own storefront tree (designsystem.porsche.com/v3/, /v4/). The bare
    hostname meta-refreshes to the current major.
  api_versioning: unknown
  api_versioning_note: >-
    No public API means no observable API version scheme. The Developer Hub proxies an
    internal service whose paths are prefixed /v1/ (leaked by an Express 404 body), which
    suggests URI-path versioning, but this is inference from an error message, not a
    published policy.
deprecation_policy:
