      status: active
      security_fixes: true
    - version: '< 4.0'
      status: end-of-life
      security_fixes: false
  migration_guides: https://designsystem.porsche.com/v4/start/migration-guides
  sunset_headers: not documented
  rfc8594_deprecation_header: not documented
  note: >-
    This is a genuine written EOL policy with a named cut line, not a marketing statement.
    It does not cover any Porsche API — only the design system.
sla:
  published: true
  scope: security response only
  url: https://github.com/porsche-design-system/porsche-design-system/blob/main/SECURITY.md
  targets:
    - stage: Acknowledgement of report
      target: within 5 business days
    - stage: Initial assessment and triage
      target: within 10 business days
    - stage: Fix for critical severity
      target: within 30 days
    - stage: Fix for high severity
      target: within 60 days
    - stage: Coordinated public disclosure
      target: after a fix is released and consumers have had reasonable time to update
  availability_sla: not published
  availability_sla_note: >-
    No uptime or latency commitment is published anywhere public. Any API SLA would sit in
    the partner contract behind the VW Group Supply Portal onboarding.
