description: >-
  Cross-cutting standards conformance for Porsche. There is no OpenAPI, GraphQL, AsyncAPI,
  WSDL or Protobuf contract to read, so every assertion below is anchored either in a
  machine-readable document Porsche serves (the OIDC discovery document, the security.txt)
  or is honestly recorded as unknown. Nothing is asserted from marketing prose.
standards:
  - id: oauth2
    name: OAuth 2.0 (RFC 6749)
    conforms: true
    evidence: >-
      identity.porsche.com/.well-known/openid-configuration advertises authorization,
      token, revocation and device-authorization endpoints and the authorization_code,
      client_credentials, refresh_token and implicit grants.
    source: https://identity.porsche.com/.well-known/openid-configuration
  - id: oidc
    name: OpenID Connect Core 1.0 + Discovery 1.0
    conforms: true
    evidence: >-
      A conformant /.well-known/openid-configuration document with issuer, jwks_uri,
      userinfo_endpoint, subject_types_supported and id_token_signing_alg_values_supported.
    source: https://identity.porsche.com/.well-known/openid-configuration
  - id: rfc7636-pkce
    name: PKCE (RFC 7636)
    conforms: true
    evidence: 'code_challenge_methods_supported: [S256, plain]'
