  - id: openid-ciba
    name: OpenID Connect Client-Initiated Backchannel Authentication (CIBA)
    conforms: true
    evidence: 'backchannel_authentication_endpoint https://identity.porsche.com/bc-authorize; backchannel_token_delivery_modes_supported: [poll]'
    source: https://identity.porsche.com/.well-known/openid-configuration
  - id: openid-backchannel-logout
    name: OpenID Connect Back-Channel Logout 1.0
    conforms: true
    evidence: 'backchannel_logout_supported: true; backchannel_logout_session_supported: true'
    source: https://identity.porsche.com/.well-known/openid-configuration
  - id: rfc9116-security-txt
    name: security.txt (RFC 9116)
    conforms: true
    evidence: >-
      https://www.porsche.com/.well-known/security.txt returns 200 with Contact, Expires,
      Policy, Hiring, Preferred-Languages and Canonical fields. Caveat — the second copy at
