  - id: rfc8693-token-exchange
    name: OAuth 2.0 Token Exchange (RFC 8693)
    conforms: true
    evidence: 'grant_types_supported includes urn:ietf:params:oauth:grant-type:token-exchange'
    source: https://identity.porsche.com/.well-known/openid-configuration
  - id: rfc7523-jwt-bearer
    name: JWT Profile for OAuth 2.0 Client Authentication and Authorization Grants (RFC 7523)
    conforms: true
    evidence: 'grant_types_supported includes urn:ietf:params:oauth:grant-type:jwt-bearer; token_endpoint_auth_methods_supported includes private_key_jwt'
