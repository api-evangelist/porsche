  Porsche Digital open-source tooling), not a wrapper around a Porsche HTTP API. Versions
  and release dates are read from the npm registry metadata endpoint.
sdk_note: >-
  Deliberately NOT wired as type SDKs. sdk_count is meant to count first-party client
  libraries for a provider's API; Porsche has no public API for these to wrap. Wiring SDKs
  here would credit Porsche with an API client surface it does not ship.
