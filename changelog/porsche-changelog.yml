    additions:
      - 'Testing: a Shadow DOM counterpart for every Testing Library query — eight query families (AltText, DisplayValue, LabelText, PlaceholderText, Role, TestId, Text, Title) in six variants each, plus screen, within, deepQuerySelector and deepQuerySelectorAll.'
