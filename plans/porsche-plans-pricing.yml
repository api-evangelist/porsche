description: >-
  Porsche publishes no API plans or pricing. Access to every Porsche API surface is granted
  by contract, not by signing up for a tier: the Porsche ID Developer Portal FAQ states
  "We do not offer any public APIs" and restricts access to Porsche AG and approved Porsche
  Partner Companies, with partner status applied for through the VW Group Supply Portal.
  There is no pricing page, no free tier, no trial, and no self-serve checkout on any
  anonymously reachable Porsche developer host.
plan_count: 0
plans: []
access_model:
  self_serve: false
  free_tier: false
  trial: false
  public_signup: false
  gate: partner contract
  onboarding: >-
    Become a VW Group / Porsche AG partner company via the VW Group Supply Portal, then
    contact touchpoint-integration-porsche-id@porsche.de with the use case. Porsche's
    integration team runs the onboarding.
  contact: mailto:touchpoint-integration-porsche-id@porsche.de
notes:
  - >-
    A /pricing/streaming route exists in the Porsche Developer Hub's client bundle,
    alongside /dashboard/streaming-calculator — so pricing for the "Streamzilla" streaming
    product does exist for signed-in partners. Both 404 anonymously, so no figure could be read.
  - >-
    This file previously carried a three-tier Free/Professional/Enterprise scaffold with
    invented quotas (1,000 and 100,000 requests/month) and TBD prices, written by the
    2026-05-04 bulk sweep. Those numbers described nothing real and have been removed.
