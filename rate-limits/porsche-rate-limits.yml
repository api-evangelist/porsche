description: >-
  Porsche publishes no rate limits. There is no public API reference on any anonymously
  reachable Porsche host, so no quota, window, burst ceiling, response header or
  exhaustion status code could be read. Whatever limits apply to Porsche Partner Companies
  live behind the Entra ID gate on portal.developer.porsche.com and
  developerhub.porsche.io, or in the partner contract itself.
limit_count: 0
limits: []
headers: {}
headers_note: >-
  No X-RateLimit-*, RateLimit-* or Retry-After signaling could be observed. No anonymous
  request reaches a Porsche API endpoint — the only anonymous responses available are from
  static portals and an Express edge that 404s.
responseCodes: {}
policies: []
notes:
  - >-
    This file previously carried five invented tiers (10/100/1000 req/min, 1,000 and
    100,000 req/month) and a full X-RateLimit-* header set, written by the 2026-05-04 bulk
    sweep. None of it was published by Porsche and all of it has been removed.
